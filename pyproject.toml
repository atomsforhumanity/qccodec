[project]
name = "qccodec"
version = "0.13.1"
description = "Encode qcdata inputs into native quantum chemistry files and decode (parse) program outputs into structured qcdata objects."
readme = "README.md"
authors = [{ name = "Colton Hicks", email = "github@coltonhicks.com" }]
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "tomli-w>=1.0.0",
    "packaging>=23.0",
    "qcdata>=0.20.1",
    "qcref>=0.3.0",
]

classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

keywords = [
    "quantum chemistry",
    "parsing",
    "file parser",
    "qcdata",
    "computational chemistry",
    "scientific computing",
]

[project.urls]
Homepage = 'https://github.com/atomsforhumanity/qccodec'
Documentation = 'https://github.com/atomsforhumanity/qccodec#readme'
Source = 'https://github.com/atomsforhumanity/qccodec'
Changelog = 'https://github.com/atomsforhumanity/qccodec/blob/master/CHANGELOG.md'
"Bug Tracker" = 'https://github.com/atomsforhumanity/qccodec/issues'

[project.optional-dependencies]
geometric = ["geometric>=1.0.1,<2"]
tcpb = ["tcpb>=0.16.0"]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "pre-commit>=4.0",
    "pytest-cov>=6.0",
    "ruff>=0.12",
    "types-toml>=0.10.8.20240310",
    "pre-commit-hooks>=5.0",
    "detect-secrets>=1.5",
    "typos>=1.30",
]
integration = [
    "qccompute>=0.15.0",
]

[project.scripts]
qccodec = "qccodec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not integration'"
markers = [
    "integration: runs a real program through qccompute; select with -m integration",
]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["*.ipynb", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["E501"] # line length is the formatter's job

[tool.ruff.lint.isort]
known-first-party = ["qccodec", "tests"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D"]
"docs/**" = ["D"]
"examples/**" = ["D"]
"build_tools/**" = ["D"]

[tool.coverage.run]
branch = true
source = ["qccodec"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.10"
files = ["src", "tests", "scripts"]
# Fixture cases hold recorded program inputs, such as copies of the Psi4 driver script.
exclude = ["^tests/data/"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.typos]
files.extend-exclude = ["tests/data/**"]

[tool.typos.default.extend-words]
runtyp = "runtyp"
