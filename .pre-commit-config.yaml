# Every hook runs the project's own locked tools through `uv run`, so local hooks,
# CI, and your editor use identical versions. Install once with
# `uv run pre-commit install`; see CONTRIBUTING.md.
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: check-yaml
        name: check yaml
        entry: uv run check-yaml
        language: system
        types: [yaml]
        exclude: ^mkdocs\.yml$
      - id: check-toml
        name: check toml
        entry: uv run check-toml
        language: system
        types: [toml]
      - id: check-merge-conflict
        name: check for merge conflicts
        entry: uv run check-merge-conflict
        language: system
        types: [text]
      - id: check-added-large-files
        name: check for added large files
        entry: uv run check-added-large-files --maxkb=250
        language: system
        exclude: ^(tests/data/|docs/)
      - id: detect-secrets
        name: detect secrets
        entry: uv run detect-secrets-hook
        language: system
        types: [text]
        exclude: (\.lock|\.ipynb)$|^tests/data/
      - id: uv-lock
        name: uv.lock is up to date
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: typos
        name: typos
        entry: uv run typos --force-exclude
        language: system
        types: [text]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false
