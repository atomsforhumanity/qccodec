name: Docs

# Publishes https://qccodec.docs.atomsforhumanity.org from the gh-pages branch.
# A release tag (the same tags as the Release workflow) or a manual run builds and
# deploys the site; pull requests that touch the docs only build it.
on:
  push:
    tags: ["*"]
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/**"
      - "examples/**"
      - "src/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yaml"

permissions:
  contents: read

jobs:
  docs:
    name: Build and publish docs
    runs-on: ubuntu-latest
    # Deploys must not overlap; pull request builds can be superseded.
    concurrency:
      group: docs-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: write # push to gh-pages
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --group docs
      - name: Build
        run: uv run mkdocs build --strict
      - name: Publish to gh-pages
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run mkdocs gh-deploy --force --message "Deploy {sha} with MkDocs {version}"
