name: Integration

# Runs real programs through qccompute (tests marked "integration"). Not a required
# check: program installs and GPU runners can fail for reasons unrelated to a change.

on:
  schedule:
    - cron: "17 7 * * *" # nightly, catches program and dependency drift
  workflow_dispatch:
  pull_request:
    paths:
      - "src/qccodec/programs/**"
      - "src/qccodec/codec.py"
      - "tests/integration/**"
      - ".github/workflows/integration.yaml"
  push:
    branches: [master]
    paths:
      - "src/qccodec/programs/**"
      - "src/qccodec/codec.py"
      - "tests/integration/**"
      - ".github/workflows/integration.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cpu:
    name: CPU programs (CREST, xtb, Psi4, DFTB+, tblite, geomeTRIC)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QCCODEC_REQUIRE_PROGRAMS: crest,xtb,psi4,dftb+,tblite
      # Official static build. conda-forge's crest 3.0.2 crashes in its optimizer
      # (Fortran format error in ancopt.f90). Update the version and checksum together.
      CREST_VERSION: v3.0.2
      CREST_SHA256: 8e5bd18b06f99741ebd7bb71b3a996295f391b2f076aaeab739740f709e9554d # pragma: allowlist secret
      # The xtb build that ships g-xTB. It also runs GFN0/1/2-xTB and GFN-FF, so it
      # is the only xtb installed. Update the version, archive, and checksum together.
      GXTB_VERSION: v2.0.1
      GXTB_ARCHIVE: xtb-6.7.1-gxtb-140526-linux-x86_64.tar.xz
      GXTB_SHA256: cdfb81164f8d3300fc451dbbf2414528b533e71f7a30ec824b564cd30d6d9e5c # pragma: allowlist secret
      # DFTB Slater-Koster parameter sets (CC-BY-SA-4.0) from github.com/dftbparams.
      # Update a version and its checksum together.
      SKF_3OB_VERSION: v3.1.0
      SKF_3OB_SHA256: 8ac194f4e6375961969f9de62ec6ef1bac1ee8323c7fdce4c737968a19c81a27 # pragma: allowlist secret
      SKF_MIO_VERSION: v1.1.0
      SKF_MIO_SHA256: 79ebed90176f3896b917ea38acbdf11959bddd2256590d51df2974e717454b83 # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v7
      - name: Install CREST
        run: |
          curl -fsSL -o crest.tar.xz "https://github.com/crest-lab/crest/releases/download/${CREST_VERSION}/crest-gnu-12-ubuntu-latest.tar.xz"
          echo "${CREST_SHA256}  crest.tar.xz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/programs"
          tar xf crest.tar.xz -C "$RUNNER_TEMP/programs"
          rm crest.tar.xz
          echo "$RUNNER_TEMP/programs/crest" >> "$GITHUB_PATH"
      - name: Install xtb (g-xTB build)
        run: |
          curl -fsSL -o xtb.tar.xz "https://github.com/grimme-lab/g-xtb/releases/download/${GXTB_VERSION}/${GXTB_ARCHIVE}"
          echo "${GXTB_SHA256}  xtb.tar.xz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/programs/xtb"
          tar xf xtb.tar.xz -C "$RUNNER_TEMP/programs/xtb" --strip-components=1
          rm xtb.tar.xz
          echo "$RUNNER_TEMP/programs/xtb/bin" >> "$GITHUB_PATH"
          echo "XTBPATH=$RUNNER_TEMP/programs/xtb/share/xtb" >> "$GITHUB_ENV"
          echo "GXTB_EXECUTABLE=$RUNNER_TEMP/programs/xtb/bin/xtb" >> "$GITHUB_ENV"
      # Psi4 ships through conda only. A wrapper exposes the psi4 command without
      # putting the environment's python ahead of uv's on PATH.
      - name: Install Psi4
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: psi4
          create-args: -c conda-forge psi4=1.11 pyddx=0.7 python=3.12
          cache-environment: true
          init-shell: none
      - name: Put psi4 on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/programs/bin"
          printf '#!/bin/sh\nexec "%s" "$@"\n' "$MAMBA_ROOT_PREFIX/envs/psi4/bin/psi4" > "$RUNNER_TEMP/programs/bin/psi4"
          chmod +x "$RUNNER_TEMP/programs/bin/psi4"
          echo "$RUNNER_TEMP/programs/bin" >> "$GITHUB_PATH"
      # DFTB+ also ships through conda; its own environment keeps it apart from Psi4.
      - name: Install DFTB+
        run: |
          "$MAMBA_EXE" create -y -n dftbplus -c conda-forge "dftbplus=25.1=nompi*"
          printf '#!/bin/sh\nexec "%s" "$@"\n' "$MAMBA_ROOT_PREFIX/envs/dftbplus/bin/dftb+" > "$RUNNER_TEMP/programs/bin/dftb+"
          chmod +x "$RUNNER_TEMP/programs/bin/dftb+"
      - name: Download DFTB parameter sets
        run: |
          params="$RUNNER_TEMP/dftb-params"
          mkdir -p "$params"
          curl -fsSL -o 3ob.tar.xz "https://github.com/dftbparams/3ob/releases/download/${SKF_3OB_VERSION}/3ob-3-1.tar.xz"
          echo "${SKF_3OB_SHA256}  3ob.tar.xz" | sha256sum --check
          curl -fsSL -o mio.tar.xz "https://github.com/dftbparams/mio/releases/download/${SKF_MIO_VERSION}/mio-1-1.tar.xz"
          echo "${SKF_MIO_SHA256}  mio.tar.xz" | sha256sum --check
          tar xf 3ob.tar.xz -C "$params"
          tar xf mio.tar.xz -C "$params"
          rm 3ob.tar.xz mio.tar.xz
          echo "QCCODEC_DFTB_PARAMETERS=$params" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install
        run: uv sync --locked --group integration --extra geometric
      - name: Program versions
        run: |
          crest --version | grep -i version
          xtb --version | grep -i version
          echo "psi4 $(psi4 --version)"
          dftb+ --version 2>&1 | grep -m1 -i "DFTB+" || true
          uv run python -c "import importlib.metadata as m; print('tblite', m.version('tblite'))"
      - name: Run integration tests
        run: uv run pytest -m integration -rs

  private:
    name: Private/GPU programs (TeraChem, ORCA)
    # Licensed programs that cannot be installed on GitHub-hosted runners, and GPU
    # programs, run on the self-hosted runner whose label the QC_PRIVATE_RUNNER
    # repository variable names; the job is skipped until that variable exists. Never
    # run fork pull requests on self-hosted runners: they would execute untrusted code
    # on the cluster.
    if: >-
      vars.QC_PRIVATE_RUNNER != '' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ vars.QC_PRIVATE_RUNNER }}
    timeout-minutes: 60
    env:
      # Programs the runner must provide; a missing one fails the run instead of
      # silently skipping its tests.
      QCCODEC_REQUIRE_PROGRAMS: ${{ vars.QC_PRIVATE_PROGRAMS || 'terachem' }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked --group integration --extra geometric
      - name: Hardware and programs
        run: |
          nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv
          for program in terachem orca crest; do
            echo "$program: $(command -v "$program" || echo 'not installed')"
          done
      - name: Run integration tests
        run: uv run pytest -m integration -rs
