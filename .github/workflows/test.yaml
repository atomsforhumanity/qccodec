name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - python-version: "3.12"
            coverage: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install package and test dependencies
        run: uv sync --all-groups --locked

      - name: Run tests
        run: uv run pytest --cov-report=term-missing --cov-report html:htmlcov --cov-config=pyproject.toml --cov=qccodec --cov=tests .

      - name: Upload coverage HTML
        if: ${{ matrix.coverage == true }}
        uses: actions/upload-artifact@v4
        with:
          name: htmlcov-py${{ matrix.python-version }}
          path: htmlcov

      # To catch manifest issues, we build and install from sdist on one version
      - name: Build sdist (only on 3.12)
        if: ${{ matrix.coverage == true }}
        run: uv build --sdist

      - name: Install from sdist (only on 3.12)
        if: ${{ matrix.coverage == true }}
        run: uv pip install --no-deps dist/*.tar.gz
